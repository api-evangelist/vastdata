    prometheusmetrics is VAST's Prometheus exporter resource. Prometheus is an open-source systems monitoring
    and alerting toolkit that provides a data model for describing and recording metrics over time and
    also provides a web application to display those metrics. Prometheus can be configured to fetch metrics
    from a third party system (such as in this case VAST Cluster) by means of a software entity called
    a Prometheus exporter. A Prometheus exporter collects metrics from a third party system, converts
    them to Prometheus metrics and exposes them via a resource path. The VAST prometheus exporter can
    fetch pre-defined metrics from the VMS database and return the data as a plain/text key-value format
    response.  You can configure the Prometheus server to scrape the metrics from the exporter at a chosen
    interval and display the VMS metrics through its display applications.

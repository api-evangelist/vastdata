aid: vastdata
name: VAST Data
description: 'VAST Data is an enterprise AI infrastructure company building a unified
  data platform for AI. Its VAST AI Operating System combines the VAST DataStore
  (all-flash file, object, and block storage over NFS, SMB, S3, and CSI), VAST
  DataBase (structured data, vectors, and streams), VAST DataSpace (a global
  namespace across on-prem, cloud, and edge), and VAST DataEngine (serverless
  functions, event triggers, and a Kafka-compatible broker). Everything is managed
  through the VAST Management System (VMS) REST API — an OpenAPI-documented surface
  with 770+ operations — plus official Python and Go SDKs, a Terraform provider,
  the vastde DataEngine CLI, an official MCP server for cluster administration, and
  published agent skills.'

- aid: vastdata:vastdata-activedirectory-api
  name: VAST Data activedirectory API
  description: >-
    Active Directory is supported as an external authorization and authentication provider. Active Directory
    may store and provide user and group attributes used by both NFS and SMB protocols. Active Directory
    can be used to enable Kerberos authentication with NFSv4 and with SMB. It is a requirement for enabling
    SMB access on VAST Cluster. Up to one Active Directory domain is supported. The configuration must
    specify an LDAP configuration for binding to the LDAP domain of the Active Directory server. Limitations
    apply to the combinations of external providers and protocol enablement.
  humanURL: https://www.vastdata.com/platform/developers

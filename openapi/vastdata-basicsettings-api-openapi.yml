openapi: 3.0.3
info:
  description: VAST Management API definition
  title: VAST API Swagger Schema activedirectory basicsettings API
  version: '1.0'
security:
- ApiToken: []
tags:
- description: This endpoint provides basic settings for users that do not have permissions to access any security realm."
  name: basicsettings
paths:
  /basicsettings/:
    get:
      description: This endpoint returns the set of basic settings for users that do not have permissions to access any security realm.
      operationId: basicsettings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSettings'
          description: ''
      summary: Return Basic Settings
      tags:
      - basicsettings
components:
  schemas:
    BasicSettings:
      type: object
  securitySchemes:
    ApiToken:
      description: Send current valid API token in an Authorization header with format Api-Token <token>.
      in: header
      name: ApiToken
      type: apiKey
    basicAuth:
      description: Basic authentication using VMS user name and password
      scheme: basic
      type: http

      - $ref: '#/components/parameters/ActiveDirectoryId'
      - in: query
        name: base_dn
        schema:
          type: string
      - in: query
        name: fqdn
        schema:
          type: string
      - in: query
        name: sid
        schema:
          type: string
      responses:

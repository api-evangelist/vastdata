  /views/{id}/permissions_repair/:
    delete:
      description: This endpoint stops a bulk permission update.
      operationId: stop_permissions_repair
      parameters:
      - description: View ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Stop Bulk Permission Update
      tags:
      - Views
    post:
      description: 'This endpoint starts a bulk permission update on a target path. In a bulk permission update, permissions of files and directory under the target path are overwritten with those of specified templates. A directory template is required.  If a template file is specified for a bulk permission update, VAST Cluster overwrites the permissions and ownership attributes of the target files and directories as follows: - Permissions of target files are overwritten with those of the template file. - Permissions of target directories are overwritten with those of the template directory. If no template file is specified, VAST Cluster overwrites the permissions and ownership attributes of the target directory with those of the template directory, and nested directories and files inherit permissions and ownership attributes from their parent. In this case, the template directory must have a default ACL on it.'
      operationId: start_permissions_repair
      parameters:
      - description: View ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              properties:
                target_path:
                  description: Path to the directory where the files and directories that you want to update permissions for reside.
                  type: string
                template_dir_path:
                  description: Path to the directory to retrieve permissions from and apply to the target path.
                  type: string
                template_file_path:
                  description: Path to a file under template_dir_path that you want to use as a template for file permissions. If specified, permissions of target files are overwritten with those of the template file and permissions of target directories are overwritten with those of the template directory. If not specified, permissions and ownership attributes of the target directory are overwritten with those of the template directory, and nested directories and files inherit permissions and ownership attributes from their parent. In this case, the template directory must have a default ACL.
                  type: string
                template_view_id:
                  description: The ID of a view that exposes template_dir_path. The view must be on the same tenant as the target path.
                  type: integer
              required:
              - target_path
              - template_view_id
              - template_dir_path
              type: object
        x-originalParamName: PermissionsRepairParams
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskInResponse'
          description: ''
      summary: Start Bulk Permission Update
      tags:
      - Views

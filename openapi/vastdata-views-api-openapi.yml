  /views/{id}/check_permissions_templates/:
    post:
      description: 'This endpoint performs validation on a set of bulk permission update parameters and should be run before performing a bulk permission update (using the  /views/{id}/permissions_repair/ path). It also returns details of the owning users and groups of the template directory and, if applicable, template file, which will be applied to the target path if a bulk permission update is performed. For the template directory, the response verifies if the directory has default ACL, which is needed if no template file is specified. The target directory is validated for the following conditions: - Is not and does not contain the cluster’s audit directory. - Does not have views with s3_versioning=True under it. - No paths under it are used in a running global snapshot stream. - Is a directory. - The length of its path does not exceed 1024 characters.'
      operationId: check_permissions_templates
      parameters:
      - description: View ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              properties:
                target_path:
                  description: Target dir path
                  type: string
                template_dir_path:
                  description: Template dir path
                  type: string
                template_file_path:
                  description: Template file path
                  type: string
                template_view_id:
                  description: Template view ID
                  type: integer
              required:
              - target_path
              - template_view_id
              - template_dir_path
              type: object
        x-originalParamName: ViewsCheckPermissionsTemplatesParams
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsCheckPermissionsTemplatesResponse'
          description: ''
      summary: Check Permissions Templates Before Bulk Permission Update
      tags:
      - Views

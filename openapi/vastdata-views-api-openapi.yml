        allow_s3_anonymous_access:
          description: Allow S3 anonymous access
          type: boolean
        allowed_delegations:
          description: "Which types of NFSv4 file delegations are enabled for this view.\n- `NONE` means NFSv4 file delegations are disabled.\n- `READ` means read type NFSv4 file delegations can be granted to a client opening a file.\n- `WRITE` means write type NFSv4 file delegations can be granted to a client opening a file.\n- `READ_WRITE` means both read and write type NFSv4 file delegations\n  can be granted to a client opening a file.\n- `USE_TENANT_ALLOWED_DELEG` (default) means the view inherits the tenant’s `allowed_delegations`.\n\n**Important:** If the tenant has `DISABLED` delegations, this overrides the view entirely.\nThe effective delegations value for this view is forced to `NONE`, regardless of the view’s setting.\n"
          enum:
          - NONE
          - READ
          - WRITE
          - READ_WRITE
          - USE_TENANT_ALLOWED_DELEG
          type: string
          x-cli-header: Allowed NFSv4 File Delegations
        auto_commit:
          description: 'Applicable if locking is enabled. Sets the auto-commit time for files that are locked automatically. These files are locked automatically after the auto-commit period elapses from the time the file is saved. Files locked automatically are locked for the default-retention-period, after which they are unlocked. Specify as an integer value followed by a letter for the unit (h - hours, d - days, y - years). Example: 2h (2 hours).'
          type: string
        bucket:
          description: S3 Bucket name
          type: string
          x-cli-header: Bucket
        bucket_creators:
          description: For S3 endpoint buckets, this is a list of users whose bucket create requests use this view.
          items:
            type: string
          type: array
          x-cli-header: Bucket Creators (Users)
          x-format: users_or_deleted
        bucket_creators_groups:
          description: For S3 endpoint buckets, this is a list of groups whose bucket create requests use this view.
          items:
            type: string
          type: array
          x-cli-header: Bucket Creators (Groups)
          x-format: groups_or_deleted
        bucket_logging:
          description: S3 bucket logging configuration. S3 bucket logging records S3 operations on a source bucket, with logs written to a different bucket configured as the destination. When the source bucket has S3 bucket logging enabled, VAST Cluster creates a log entry in AWS log format for each request made to the source bucket, and periodically uploads the log objects to a destination bucket. The format of log object keys can be configured to allow for date-based partitioning of log objects.
          properties:
            destination_id:
              description: The ID of the S3 bucket view configured as the bucket logging destination, to store S3 bucket logs for the view. If destination_id is configured, S3 bucket logging is enabled.
              type: integer
              x-cli-header: Bucket logging destination id
            key_format:
              description: 'The format for log object keys. SIMPLE_PREFIX=[DestinationPrefix][YYYY]-[MM]-[DD]-[hh]-[mm]-[ss]-[UniqueString], PARTITIONED_PREFIX_EVENT_TIME=[DestinationPrefix][SourceUsername]/[SourceBucket]/[YYYY]/[MM]/[DD]/[YYYY]-[MM]-[DD]-[hh]-[mm]-[ss]-[UniqueString] where the partitioning is done based on the time when the logged events occurred, PARTITIONED_PREFIX_DELIVERY_TIME=[DestinationPrefix][SourceUsername]/[SourceBucket]/[YYYY]/[MM]/[DD]/[YYYY]-[MM]-[DD]-[hh]-[mm]-[ss]-[UniqueString] where the partitioning is done based on the time when the log object has been delivered to the destination bucket. Default: SIMPLE_PREFIX'
              enum:
              - SIMPLE_PREFIX
              - PARTITIONED_PREFIX_EVENT_TIME
              - PARTITIONED_PREFIX_DELIVERY_TIME
              type: string
              x-cli-header: Bucket logging - S3 prefix key format
            prefix:
              description: A prefix that is prepended to each key of a log object uploaded to the destination bucket. This prefix can be used to categorize log objects if, for example, you use the same destination bucket for multiple source buckets. The prefix can be up to 128 characters and must follow S3 object naming rules.
              type: string
              x-cli-header: Bucket logging - S3 prefix key
          type: object

        effective_allowed_delegations:
          description: "The resolved NFSv4 delegation type that applies to the View.\n\nResolution rules:\n- If the tenant's allowed delegations is `DISABLED`, the effective value is forced to `NONE`.\n- Otherwise, if `allowed_delegations` is `USE_TENANT_ALLOWED_DELEG`,\n  the value is inherited from the Tenant's `allowed_delegations`.\n- In all other cases, the effective value equals this object's own `allowed_delegations`.\n\nThis field shows the final delegation behavior observed by clients.\n"
          enum:
          - NONE
          - READ
          - WRITE
          - READ_WRITE
          type: string
          x-cli-header: Effective Allowed NFSv4 File Delegations
        event_notifications:

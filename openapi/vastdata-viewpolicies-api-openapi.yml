components:
  schemas:
    ViewPolicy:
      properties:
        access_flavor:
          description: Applicable with MIXED_LAST_WINS security flavor (Access can be set via NFSv3 regardless of this option)
          type: string
        allowed_characters:
          description: 'How to determine which characters are allowed in file names. ''LCD'' (default): Allows only characters allowed by all VAST Cluster-supported protocols, regardless of the specific protocol enabled on a specific view. With this (default) option, the limitation on the length of a single component of the path is 255 characters. ''NPL'': Imposes no limitation beyond that of the client protocol.'
          enum:
          - LCD
          - NPL
          type: string
        apple_sid:
          description: For use when connecting from Mac clients to SMB shares, this option enables Security IDs (SIDs) to be returned in Apple compatible representation.
          type: boolean
          x-cli-header: Apple sid
        atime_frequency:
          description: 'Frequency for updating the atime attribute of NFS files. atime is updated on read operations if the difference between the current time and the file''s atime value is greater than the atime frequency. Default: 3600'
          type: string
          x-example: 30m
        auth_source:
          description: Specifies which source is trusted for the user's group memberships, when users' access to the view is authorized.
          enum:
          - RPC
          - PROVIDERS
          - RPC_AND_PROVIDERS
          type: string
          x-cli-header: Group Membership Source
          x-format: pretty_auth_source
        change:
          items:
            type: string
          type: array
        cluster:
          description: Parent Cluster
          type: string
          x-cli-header: Cluster
        cluster_id:
          description: Parent Cluster ID
          type: integer
        count_views:
          description: Number of Policy related Views
          type: integer
        created:
          format: date-time
          type: string
          x-cli-header: Created time
          x-format: datetime2display
        data_create_delete:
          description: Create/Delete Files/Directories/Objects
          type: boolean
        data_modify:
          description: Modify data/MD
          type: boolean
        data_read:
          description: Read data
          type: boolean
        disable_handle_lease:
          type: boolean
        disable_read_lease:
          type: boolean
        disable_write_lease:
          type: boolean
        enable_access_to_snapshot_dir_in_subdirs:
          description: Specifies whether to make the .snapshot directory visible in subdirectories of the View.
          type: boolean
          x-cli-header: Accessible .snapshot Folder In Subdirectories
        enable_listing_of_snapshot_dir:
          description: Specifies whether to make the .snapshot directory visible in subdirectories of the View.
          type: boolean
          x-cli-header: Visible .snapshot Folder In SMB Subdirectories
        enable_snapshot_lookup:
          description: Specifies whether to make the .snapshot directory accessible in subdirectories of the View.
          type: boolean
          x-cli-header: Accessible .snapshot Folder In Subdirectories
        enable_visibility_of_snapshot_dir:
          description: Specifies whether to make the .snapshot directory visible in subdirectories of the View.
          type: boolean
          x-cli-header: Visible .snapshot Folder In SMB Subdirectories
        expose_id_in_fsid:
          type: boolean
        flavor:
          description: Security flavor, which determines how file and directory permissions are applied in multiprotocol views.
          enum:
          - NFS
          - SMB
          - MIXED_LAST_WINS
          - S3_NATIVE
          type: string
        full:
          items:
            type: string
          type: array
        gid_inheritance:
          description: 'Specifies how files receive their owning group when they are created. ''LINUX'' (default): Each new file inherits its owning group from the group ID of the user who creates the file. ''BSD'': Each new file inherits its owning group from the group ID of the parent directory.'
          enum:
          - BSD
          - LINUX
          type: string
        guid:
          description: Globally unique identifier
          type: string
        id:
          description: ID
          type: integer
          x-cli-header: ID
        inherit_parent_mode_bits:
          description: 'Enable NFS behavior of inheriting POSIX settings from the parent directory versus configured values.

            '
          type: boolean
        internal:
          type: boolean
        is_block_default_policy:
          description: Specifies whether to make this View Policy default for BLOCK
          type: boolean
        is_s3_default_policy:
          description: Specifies whether to make this View Policy default for S3
          type: boolean
        log_deleted:
          description: Log deleted files/dirs from trash dir
          type: boolean
        log_full_path:
          description: Log full path
          type: boolean
        log_hostname:
          description: Log hostname
          type: boolean
        log_username:
          description: Log username
          type: boolean
        name:
          description: Name of the policy
          type: string
          x-cli-header: Name
        nfs_all_squash:
          description: Hosts with all squash policy
          items:
            type: string
          type: array
          x-cli-header: NFS-all-squash
        nfs_case_insensitive:
          description: Force case insensitivity for NFSv3 and NFSv4
          type: boolean
          x-cli-header: NFS-case-insensitivity
        nfs_enforce_mtls:
          description: Specifies whether we enforce mTLS authentication over NFS.
          type: boolean
        nfs_enforce_tls:
          description: Accept NFSv3 and NFSv4 client mounts only if they are TLS-encrypted. Use only with Minimal Protection Level set to System or None.
          type: boolean
          x-cli-header: Enforce TLS to encrypt traffic
        nfs_enforce_tls_relaxed:
          description: Whether to relax TLS enforcement by not requiring TLS for auxiliary NFSv3 sub-protocols | (MOUNT, NLM, NSM, RQUOTA, NFSACL)
          type: boolean
        nfs_minimal_protection_level:
          description: 'Minimal Protection Level for NFSv4 client mounts: ''KRB_AUTH_ONLY'' allows client mounts with Kerberos authentication only (using the RPCSEC_GSS authentication service), ''SYSTEM'' allows client mounts using either the AUTH_SYS RCP security flavor (the traditional default NFS authentication scheme) or with Kerberos authentication, ''NONE'' (default) allows client mounts with the AUTH_NONE (anonymous access), or AUTH_SYS RCP security flavors, or with Kerberos authentication.'
          enum:
          - NONE
          - SYSTEM
          - KRB_AUTH_ONLY
          - KRB_INTEGRITY
          - KRB_PRIVACY
          type: string
        nfs_no_squash:
          description: Hosts with no squash policy
          items:
            type: string
          type: array
          x-cli-header: NFS-no-squash
        nfs_posix_acl:
